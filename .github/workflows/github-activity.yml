name: Sync GitHub activity

on:
  schedule:
    - cron: '51 4 * * *' # daily ~04:51 UTC, after the profile build (04:23)
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'scripts/sync-github-activity.mjs'
      - '.github/workflows/github-activity.yml'

concurrency:
  group: github-activity
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require a token that can see private contributions
        env:
          PAT: ${{ secrets.STREAK_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::STREAK_PAT is not set in this repository. The default Actions token authenticates as github-actions[bot] and cannot see private contributions, so the activity numbers would silently collapse to the public-only subset (~850 instead of ~24 800). Set the classic PAT with the read:user scope."
            exit 1
          fi

      - name: Generate GitHub activity payload
        run: bun run sync:activity
        env:
          # Classic PAT carrying the read:user scope. Without it GitHub hides the
          # private contributions (the vault auto-commits dominate the total), and
          # the site would disagree with the profile repo's cards by ~29x. No
          # fallback on purpose: a louder failure beats a quietly wrong chart.
          GITHUB_TOKEN: ${{ secrets.STREAK_PAT }}

      - name: Commit payload
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: 'chore: sync GitHub activity charts [skip ci]'
          file_pattern: 'src/data/github-activity.json'
