name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Evidence for the METRICS drift guard (tests/lib/metrics.test.ts): the
      # sibling sql-analytics-case-study repo, checked out below.
      SQL_CASES_DIR: ${{ github.workspace }}/vendor/sql-analytics-case-study/cases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site repo is checked out alone, so the drift guard cannot see the
      # sibling case-study repo it counts .sql files from. Fetch that public
      # repo into `vendor/` (kept out of git) instead of weakening the guard.
      - name: Checkout SQL case-study repo (drift-guard evidence)
        uses: actions/checkout@v4
        with:
          repository: NikitaBoyarkin/sql-analytics-case-study
          path: vendor/sql-analytics-case-study

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: GitHub ↔ portfolio drift check
        run: bun run sync:gh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Type-check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build site
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
        run: bun run build

      - name: Validate built site
        run: make check

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Run Lighthouse CI
        run: bunx @lhci/cli autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci-reports/

  deploy:
    if: github.event_name == 'push'
    needs: [build, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
