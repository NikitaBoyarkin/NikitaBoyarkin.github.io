name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is set per job, not per workflow — see the build and deploy jobs.
# A workflow-level `group: pages` would put every run, build included, behind the
# previous one; a burst of pushes then queues instead of superseding, which is
# how 21 runs averaged 401 s of wall clock for 76 s of actual work.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Cancellable: a newer push makes this run obsolete, and cancelling a
      # queued or building run is free. Pull requests get their own group via
      # github.ref, so two PRs never cancel each other.
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Evidence for the METRICS drift guard (tests/lib/metrics.test.ts): the
      # sibling sql-analytics-case-study repo, checked out below.
      SQL_CASES_DIR: ${{ github.workspace }}/vendor/sql-analytics-case-study/cases
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # The site repo is checked out alone, so the drift guard cannot see the
      # sibling case-study repo it counts .sql files from. Fetch that public
      # repo into `vendor/` (kept out of git) instead of weakening the guard.
      - name: Checkout SQL case-study repo (drift-guard evidence)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NikitaBoyarkin/sql-analytics-case-study
          path: vendor/sql-analytics-case-study

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pinned, not `latest`: it matches the dev machine, and the setup step
          # keys its cache on this value — a floating version invalidates the
          # cache on every Bun release.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: GitHub ↔ portfolio drift check
        run: bun run sync:gh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Games hub PostHog key drift check
        # public/games/* hardcode the capture token (static files cannot read
        # env at runtime). Bind that literal to the secret the main site uses:
        # if a key rotation misses the games hub, the build goes red instead of
        # games silently landing in another PostHog project.
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
        run: |
          if [ -z "$PUBLIC_POSTHOG_KEY" ]; then
            echo "skip: PUBLIC_POSTHOG_KEY secret not available"
            exit 0
          fi
          status=0
          for f in $(grep -rlE 'phc_[A-Za-z0-9]{20,}' public/games/); do
            if ! grep -q "$PUBLIC_POSTHOG_KEY" "$f"; then
              echo "drift: $f hardcodes a capture key that differs from PUBLIC_POSTHOG_KEY"
              status=1
            fi
          done
          exit $status

      - name: Build site
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_BEACON_ENDPOINT: ${{ secrets.PUBLIC_BEACON_ENDPOINT }}
        run: bun run build

      - name: Validate built site
        # The single gate. `make check` runs `bun run check` (astro check + tsc),
        # the unit suite, test:monitoring, test:built and scripts/check_site.py;
        # running it here also means test:built sees a real dist/. Type-check and
        # Unit tests used to run as separate pre-build steps as well, paying for
        # the same astro check and the same suite twice.
        run: make check

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Not cancellable: killing this job mid-flight can leave GitHub Pages on a
      # half-published release. It is short and rare enough that serialising it
      # costs nothing.
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
