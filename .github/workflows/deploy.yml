name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is set per job, not per workflow — see the build and deploy jobs.
# A workflow-level `group: pages` would put every run, build included, behind the
# previous one; a burst of pushes then queues instead of superseding, which is
# how 21 runs averaged 401 s of wall clock for 76 s of actual work.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Cancellable: a newer push makes this run obsolete, and cancelling a
      # queued or building run is free. Pull requests get their own group via
      # github.ref, so two PRs never cancel each other.
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Evidence for the METRICS drift guard (tests/lib/metrics.test.ts): the
      # sibling sql-analytics-case-study repo, checked out below.
      SQL_CASES_DIR: ${{ github.workspace }}/vendor/sql-analytics-case-study/cases
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # The site repo is checked out alone, so the drift guard cannot see the
      # sibling case-study repo it counts .sql files from. Fetch that public
      # repo into `vendor/` (kept out of git) instead of weakening the guard.
      - name: Checkout SQL case-study repo (drift-guard evidence)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NikitaBoyarkin/sql-analytics-case-study
          path: vendor/sql-analytics-case-study

      # The Volta analytics board (charts/volta-core.yml) and its CSVs live in
      # the sibling volta-banking repo — the single source of truth. Checked out
      # into `vendor/` (gitignored) so the deploy can re-render the published
      # demo from that board instead of trusting a hand-committed HTML copy.
      - name: Checkout volta-banking (board source)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NikitaBoyarkin/volta-banking
          path: vendor/volta-banking

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pinned, not `latest`: it matches the dev machine, and the setup step
          # keys its cache on this value — a floating version invalidates the
          # cache on every Bun release.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: GitHub ↔ portfolio drift check
        run: bun run sync:gh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Projects registry drift check
        # public/projects.json is the machine-readable registry the GitHub
        # profile (NikitaBoyarkin/) fetches daily from raw.githubusercontent.
        # It is generated from the project/volta-parts collections, so a content
        # edit that forgets `bun run export:projects` would drift the profile
        # silently. Regenerate and fail if the committed file differs — same
        # guard shape as the GitHub ↔ portfolio drift check above.
        run: |
          bun run export:projects
          if ! git diff --quiet -- public/projects.json; then
            echo "::error::public/projects.json is stale — run 'bun run export:projects' and commit it"
            git --no-pager diff --stat -- public/projects.json
            exit 1
          fi

      - name: Games hub PostHog key drift check
        # public/games/* hardcode the capture token (static files cannot read
        # env at runtime). Bind that literal to the secret the main site uses:
        # if a key rotation misses the games hub, the build goes red instead of
        # games silently landing in another PostHog project.
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
        run: |
          # A missing secret must fail, not skip: the site build injects the same
          # variable, so an absent secret means the deploy would ship with no
          # analytics at all. Exiting 0 here hides exactly that.
          if [ -z "$PUBLIC_POSTHOG_KEY" ]; then
            echo "::error::PUBLIC_POSTHOG_KEY is not set — the drift check cannot run, and the build would ship without analytics"
            exit 1
          fi

          # Iterate the expected set (the glob), not "files that happen to contain
          # a token": the old version only inspected files that still had one, so
          # a game that lost its token entirely was invisible and the build
          # stayed green. `find -print0` + `read -d ''` is portable, unlike
          # `grep -Z`, whose NUL output some greps silently downgrade to newlines.
          rc=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! grep -q "$PUBLIC_POSTHOG_KEY" "$f"; then
              echo "::error::$f does not carry PUBLIC_POSTHOG_KEY — a rotated secret or a lost token would silently change where this game reports"
              rc=1
            fi
          done < <(find public/games -maxdepth 1 -type f \( -name '*.svg' -o -name 'index.html' \) -print0)

          # Degenerate case: if the glob matched nothing the guard verified
          # nothing, which must not read as success.
          if [ "$count" -eq 0 ]; then
            echo "::error::no games files found under public/games/ — the drift check verified nothing"
            rc=1
          fi

          echo "checked $count file(s) under public/games/ against PUBLIC_POSTHOG_KEY"
          exit $rc

      - name: Setup uv (Volta board CSV materialisation)
        # The board's `volta` source reads data/charts/funnel.csv, which
        # volta-banking gitignores — it is derived from the tracked
        # data/volta_funnel_data.csv by scripts/build_charts_data.py, because
        # DuckDB reads the raw timestamp columns as nanoseconds and dbt-charts'
        # CSV loader cannot convert them. Reproduce that derivation inside the
        # checkout rather than committing a copy that can silently drift from
        # the dataset it is built from.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Materialise Volta board CSVs
        run: |
          cd vendor/volta-banking
          # --no-project: the transform only needs pandas. Syncing the project's
          # own env would pull scikit-learn, shap and scipy for nothing.
          uv run --no-project --with pandas python scripts/build_charts_data.py

      - name: Render Volta board demo
        # Regenerate public/demos/volta-board/index.html from the board in
        # vendor/volta-banking. `--output` resolves relative to --project-dir,
        # not the cwd, so the target must be absolute. Runs before the Astro
        # build so public/ carries the fresh render into dist/.
        #
        # Pinned, not floating: dbt-charts 0.10.0 makes every `type: csv` file
        # source unreadable — `ERR-FILE-SOURCE-UNSUPPORTED-TYPE: reading the
        # schema of the object registered as '_dct_arrow_ingest' failed:
        # ResourceInUseException: connection has an unfinished result from
        # execute()`. It fires even on a bare `SELECT COUNT(*) FROM funnel`,
        # so it is the loader, not the board's SQL. 0.9.1 renders the same
        # file green; drop the pin once upstream fixes the arrow ingest path.
        run: |
          mkdir -p public/demos/volta-board
          pipx run --spec dbt-charts==0.9.1 dct render charts/volta-core.yml \
            --project-dir vendor/volta-banking \
            --format html \
            --output "$GITHUB_WORKSPACE/public/demos/volta-board/index.html"

      - name: Build & validate site
        # Build then run the single gate. `make check` depends on `build`, so
        # test:built always sees a fresh dist/ — a stale dist/ let the local
        # gate pass while CI failed (prd-v9.md G7). Building inside `check`
        # also means we never build twice.
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_BEACON_ENDPOINT: ${{ secrets.PUBLIC_BEACON_ENDPOINT }}
        run: make check

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Not cancellable: killing this job mid-flight can leave GitHub Pages on a
      # half-published release. It is short and rare enough that serialising it
      # costs nothing.
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
