name: CI failure → issue

# Loop B2/B3: surface a failed deploy (and a failed Lighthouse audit) as a GitHub
# issue, instead of relying on the easy-to-miss default "workflow failed" email.
#
# Why a separate `workflow_run` workflow rather than a step inside deploy.yml:
#   * deploy.yml runs on PRs too — this one only fires for a real failure on
#     `master` (a PR run never notifies).
#   * lighthouse.yml *skips itself* when the deploy run failed (no site worth
#     auditing) — so a skipped audit is a symptom of a failed deploy. Watching
#     the `Deploy…` run here means that failure is never silent (B3).
# One open issue per workflow is reused, so a flapping deploy comments instead
# of opening a new issue on every push.

on:
  workflow_run:
    workflows:
      - "Deploy Astro site to GitHub Pages"
      - "Lighthouse"
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-failure-notify-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  notify:
    # A `Lighthouse` run is itself started by `workflow_run`, so its own `event`
    # is `workflow_run`, never `push` — the push/branch filter would skip every
    # Lighthouse failure. That gate belongs to the deploy run only: Lighthouse
    # reaches here at all only after a successful push deploy to master (see
    # its own `if:`), so a failed audit is notify-worthy on its own.
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && (
        github.event.workflow_run.name == 'Lighthouse'
        || (
          github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'master'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="CI failure: ${WF} on master"
          body="<!-- ci-failure-notify -->
          The **${WF}** workflow failed on \`master\`.

          - Run: ${RUN_URL}
          - Commit: \`${SHA}\`
          "
          number=$(gh issue list --state open --search "${title} in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "Commented on existing issue #${number}"
          else
            gh issue create --title "$title" --body "$body"
          fi
