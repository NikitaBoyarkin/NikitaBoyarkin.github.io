name: Sync content to Supabase

on:
  schedule:
    - cron: '41 4 * * *' # daily ~04:41 UTC, after the GitHub and contact syncs
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'scripts/sync-supabase-content.mjs'
      - '.github/workflows/sync-analytics-content.yml'
      - 'public/projects.json'
      - 'src/content/posts/**'
      - 'src/content/posts-en/**'

concurrency:
  group: supabase-content
  cancel-in-progress: true

permissions:
  contents: read

# The analytics Supabase project is separate from the contact backend, so it
# carries its own secrets. Workflow-level env may read secrets; a job-level `if`
# may not. The guard keeps the cron green until the project exists and arms
# itself the moment both secrets are added.
env:
  HAS_ANALYTICS: ${{ secrets.ANALYTICS_SUPABASE_URL != '' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # public/projects.json is regenerated by the deploy workflow's drift check,
      # so a stale copy fails there first. Here it is only read.
      - name: Dry run (row counts)
        run: bun run sync:analytics-content

      - name: Upsert content
        if: ${{ env.HAS_ANALYTICS == 'true' }}
        run: bun run sync:analytics-content:apply
        env:
          ANALYTICS_SUPABASE_URL: ${{ secrets.ANALYTICS_SUPABASE_URL }}
          ANALYTICS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ANALYTICS_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Skip notice
        if: ${{ env.HAS_ANALYTICS != 'true' }}
        run: echo "::notice::ANALYTICS_SUPABASE_URL secret is not set — content sync skipped."
