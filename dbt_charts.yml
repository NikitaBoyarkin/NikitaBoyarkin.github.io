# dbt charts project configuration — anchors the project root; `dct` walks up
# to find this file. Boards live in charts/. Full reference: `dct docs sources`.

sources:
  # Flattened Lighthouse CI runs (scripts/build-lh-table.mjs).
  # The source reports in lhci-reports/ are gitignored, so this CSV is the
  # committed read surface — re-run the flattener after every `lhci autorun`.
  lhci:
    type: csv
    files:
      reports: data/lhci-table.csv

  # Local Trino coordinator (483, http://127.0.0.1:8080) reading two DuckDB
  # marts from sibling projects as *separate catalogs*, so one query can span
  # them. Local-only by nature: the board is rendered on this machine and the
  # resulting HTML is what ships in public/demos/.
  # `catalog` is dbt-trino's `database` and selects the default catalog only —
  # a fully-qualified `duckdb_promo.main.<table>` still resolves across catalogs.
  trino:
    type: trino
    host: 127.0.0.1
    port: 8080
    catalog: duckdb
    schema: main
    user: dbt_charts

