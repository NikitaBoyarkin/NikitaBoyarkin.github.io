[package]
name = "beacon-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/beacon.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
metrics-rs = { path = "../metrics-rs" }
jsnum = { path = "../jsnum" }
wasm-bindgen = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
