[package]
name = "metrics-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/metrics.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jsnum = { path = "../jsnum" }
wasm-bindgen = "0.2"
indexmap = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
