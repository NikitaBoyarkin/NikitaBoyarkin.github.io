[request]
method = "POST"
path = "/beacon"
body = '[{"type": "pageview", "path": "/a", "locale": "ru"}, {"type": "pageview", "path": "/b", "locale": "en", "session_id": "s1"}]'

[response]
status = 204

[response.headers]
access-control-allow-headers = "*"
access-control-allow-methods = "POST, OPTIONS"
access-control-allow-origin = "*"
