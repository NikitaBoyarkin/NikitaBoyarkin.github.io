[package]
name = "posthog-pull-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/posthog-pull.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
metrics-rs = { path = "../metrics-rs" }
jsnum = { path = "../jsnum" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
napi = { version = "3", features = ["async"] }
napi-derive = "3"
futures = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
