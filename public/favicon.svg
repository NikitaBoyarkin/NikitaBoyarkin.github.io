<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* Compact favicon variant of the nav mark: at 16px the nav's ring and
       letters merge into one blob, so the fill carries the mark and the
       lettermark is knocked out of it. One fixed palette for both colour
       schemes — the mark reads the same on light and dark browser chrome. */
    .cell { fill: #171717; }
    .mono { fill: #f8f2d8; }
  </style>
  <path class="cell" d="M96 50 73 89.8 27 89.8 4 50 27 10.2 73 10.2Z"/>
  <text class="mono" x="50" y="65" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-2" text-anchor="middle">NB</text>
</svg>
