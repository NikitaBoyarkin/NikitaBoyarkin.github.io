<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peeking у p-value vs Bayesian posterior</title>
<meta name="theme-color" content="#0f2a2b">
<script src="/demos/demo-theme.js"></script>
<link rel="stylesheet" href="/demos/demo.css">
<style>
  /* Layout only. Colour, type family, radii, shadows and the wallpaper come
     from /demos/demo.css, which is also what makes this page follow the site's
     three themes. This is the one demo canvas paints into, so its colours are
     read back from the same tokens by demo-theme.js's demoTokens(). */
  .chart-wrap{position:relative; max-width:640px}
  canvas{width:100%; height:300px; display:block; border-radius:var(--radius-md)}
  .controls{margin-top:14px; display:flex; flex-wrap:wrap; gap:var(--space-4); align-items:center}
  .slider{display:flex; align-items:center; gap:10px; flex:1; min-width:220px}
  input[type=range]{flex:1; accent-color:var(--text-accent)}
  .readout{display:flex; gap:18px; font-size:13px}
  .readout b{font-variant-numeric:tabular-nums}
  .pval{color:var(--dv-bad)} .pod{color:var(--dv-good)}

  .demo-legend{margin-bottom:10px}
  .demo-legend i{width:14px; height:3px; display:inline-block; border-radius:2px}
  .sw-p{background:var(--dv-bad)}
  .sw-b{background:var(--dv-good)}
  .sw-t{background:var(--dv-threshold); height:1px}

  /* demo.css supplies the flag's colour (border + currentColor from --dv-warn /
     --dv-good); this carries its size, because .demo-flag is a compact badge
     and this one is a full sentence. */
  .flag{display:none; padding:var(--space-2) var(--space-3);
    border-radius:var(--radius-md); font-size:13px; max-width:640px}
  .flag.show{display:block}
</style>
</head>
<body>
  <h1 class="demo-title">Peeking у p-value vs Bayesian posterior</h1>
  <p class="demo-lede">Двигайте размер выборки. p-value (красный) дрожит и ловит ложную значимость, posterior PoD (зелёный) сходится плавно.</p>

  <div class="demo-legend">
    <span><i class="sw-p"></i>p-value</span>
    <span><i class="sw-b"></i>PoD (вероятность, что B &gt; A)</span>
    <span><i class="sw-t"></i>порог 0,05</span>
  </div>

  <div class="chart-wrap"><canvas id="cv" width="1280" height="600"></canvas></div>

  <div class="controls">
    <div class="slider">
      <label for="n">Выборка n</label>
      <input type="range" id="n" min="100" max="3000" step="100" value="300">
      <b id="nval">300</b>
    </div>
    <div class="readout">
      <span class="pval">p-value: <b id="pv">—</b></span>
      <span class="pod">PoD: <b id="pd">—</b></span>
    </div>
  </div>
  <div class="demo-flag flag" id="flag"></div>

<script>
// 30 точек: n = 100..3000 шаг 100
const N = Array.from({length:30}, (_,i)=>100*(i+1));
// p-value: шумный, ранние ложные срабатывания, затем стабильно <0,05
const PVAL = [0.41,0.18,0.04,0.12,0.06,0.21,0.03,0.15,0.08,0.02,
              0.11,0.05,0.09,0.04,0.07,0.03,0.05,0.02,0.04,0.01,
              0.03,0.02,0.01,0.02,0.01,0.01,0.005,0.01,0.005,0.003];
// PoD: плавно растёт от неопределённости к уверенности
const POD = [0.58,0.62,0.66,0.63,0.67,0.68,0.72,0.69,0.73,0.76,
             0.74,0.78,0.80,0.82,0.81,0.84,0.86,0.87,0.88,0.89,
             0.90,0.91,0.92,0.93,0.93,0.94,0.95,0.95,0.96,0.97];

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const nInput = document.getElementById("n");
const nVal = document.getElementById("nval");
const pvEl = document.getElementById("pv");
const pdEl = document.getElementById("pd");
const flag = document.getElementById("flag");

// Canvas cannot be recoloured by CSS, so the dataviz tokens are read back as
// literal strings. demo-theme.js returns the SPECIFIED TEXT of each custom
// property, which for these is a hex colour — usable as a strokeStyle with no
// parsing. Re-read on demo:themechange rather than on every frame: a slider
// drag would otherwise force a style recalc 30 times a second.
const TOKEN_NAMES = ['--dv-axis','--dv-label','--dv-threshold','--dv-current',
                     '--dv-bad','--dv-good','--font-sans'];
let C = {};
function readColors(){ C = window.demoTokens(TOKEN_NAMES); }

function idxAt(n){ return Math.min(N.length-1, Math.max(0, (n/100)-1)); }

function draw(n){
  const W = cv.width, H = cv.height;
  const padL = 60, padR = 30, padT = 20, padB = 50;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  ctx.clearRect(0,0,W,H);

  const xAt = v => padL + (v - 100)/(3000-100) * plotW;
  const yAt = v => padT + (1 - v) * plotH; // 0..1

  // Сетка + оси. --dv-axis, не --border-color: сетка здесь — единственная
  // привязка шкалы, то есть графический объект без текстового дубля (WCAG 1.4.11).
  ctx.strokeStyle = C['--dv-axis']; ctx.fillStyle = C['--dv-label'];
  ctx.lineWidth = 1; ctx.font = "20px " + C['--font-sans'];
  [0, 0.25, 0.5, 0.75, 1].forEach(t=>{
    const y = padT + (1-t)*plotH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(t.toFixed(2), 14, y+7);
  });
  // подписи n
  [100,1000,2000,3000].forEach(v=>{
    const x = xAt(v);
    ctx.fillText(String(v), x-22, H-padB+28);
  });
  // порог 0.05
  ctx.strokeStyle = C['--dv-threshold']; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(padL, yAt(0.05)); ctx.lineTo(W-padR, yAt(0.05)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = C['--dv-label'];
  ctx.fillText("α = 0,05", W-padR-90, yAt(0.05)-6);

  const cut = idxAt(n);

  // p-value
  ctx.strokeStyle = C['--dv-bad']; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i=0; i<=cut; i++){
    const x = xAt(N[i]), y = yAt(PVAL[i]);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // точки-маркеры ложной значимости (p<0.05 при PoD<0.85)
  for (let i=0; i<=cut; i++){
    if (PVAL[i] < 0.05 && POD[i] < 0.85){
      ctx.fillStyle = C['--dv-bad'];
      ctx.beginPath(); ctx.arc(xAt(N[i]), yAt(PVAL[i]), 7, 0, 2*Math.PI); ctx.fill();
    }
  }

  // PoD
  ctx.strokeStyle = C['--dv-good']; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i=0; i<=cut; i++){
    const x = xAt(N[i]), y = yAt(POD[i]);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // вертикаль на текущем n
  ctx.strokeStyle = C['--dv-current']; ctx.lineWidth = 2;
  const xn = xAt(n);
  ctx.beginPath(); ctx.moveTo(xn, padT); ctx.lineTo(xn, padT+plotH); ctx.stroke();
}

function update(){
  const n = +nInput.value;
  nVal.textContent = n;
  const i = idxAt(n);
  const pv = PVAL[i], pd = POD[i];
  pvEl.textContent = pv.toFixed(3);
  pdEl.textContent = pd.toFixed(2);
  draw(n);
  // Ловушка peeking: p<0.05, но PoD ещё низкая
  if (pv < 0.05 && pd < 0.85){
    flag.className = "demo-flag flag show";
    flag.innerHTML = "⚠️ Ловушка peeking: при n = "+n+
      " p-value = "+pv.toFixed(3)+
      " (значимо!), но PoD = "+pd.toFixed(2)+
      " — уверенности нет. Частотный вывод развернётся на большем n.";
  } else if (pv < 0.05 && pd >= 0.9){
    flag.className = "demo-flag flag show demo-flag--ok";
    flag.innerHTML = "✅ n = "+n+": p-value = "+pv.toFixed(3)+
      " и PoD = "+pd.toFixed(2)+
      " — оба метода согласны, эффект подтверждён.";
  } else {
    flag.className = "demo-flag flag";
  }
}

readColors();
// Первый кадр — после загрузки Inter: иначе оси и подписи нарисовались бы
// метриками фолбэк-шрифта и прыгнули, когда шрифт доедет.
document.fonts.ready.then(update);
nInput.addEventListener("input", update);
document.addEventListener("demo:themechange", ()=>{ readColors(); update(); });
</script>
</body>
</html>
