<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пайплайн Telegram-отчёта</title>
<meta name="theme-color" content="#0f2a2b">
<script src="/demos/demo-theme.js"></script>
<link rel="stylesheet" href="/demos/demo.css">
<style>
  /* Layout only. Colour, type family, radii, shadows and the wallpaper come
     from /demos/demo.css, which is also what makes this page follow the site's
     three themes. */
  .flow{display:flex; align-items:stretch; gap:0; max-width:720px; position:relative}
  .stage{flex:1; position:relative; display:flex; flex-direction:column; align-items:center;
    gap:var(--space-2); padding:14px 6px; cursor:default; transition:transform .15s ease}
  .stage:hover{transform:translateY(-3px)}
  .node{width:64px; height:64px; border-radius:var(--radius-xl); display:flex; align-items:center;
    justify-content:center; font-size:26px; background:var(--background-secondary);
    border:2px solid var(--border-color); box-shadow:0 2px 6px var(--shadow-color)}
  /* The hover border is an interactive affordance, so it takes the coral action
     accent (--border-active) — dataviz tokens never style a hover state. The
     shadow is the site's token, not a green-tinted one-off. */
  .stage:hover .node{border-color:var(--border-active); box-shadow:0 6px 16px var(--shadow-color)}
  .label{font-size:12px; font-weight:600; text-align:center}
  .sub{font-size:11px; color:var(--text-muted); text-align:center; min-height:28px}
  /* --dv-axis, not --border-color: a hairline divider is a surface rule where
     1.5:1 is fine, but this line IS the diagram's structure — a graphical
     object with no text alternative, so WCAG 1.4.11 wants 3:1 against the page. */
  .arrow{flex:0 0 28px; align-self:center; position:relative; height:2px;
    background:var(--dv-axis); margin-top:-38px}
  .arrow::after{content:""; position:absolute; right:-1px; top:-4px; border:5px solid transparent;
    border-left-color:var(--dv-axis); border-right:0}
  .dot{position:absolute; top:-3px; left:0; width:8px; height:8px; border-radius:var(--radius-full);
    background:var(--text-accent-dataviz); animation:flow 2.4s linear infinite}
  .arrow:nth-child(2n) .dot{animation-delay:.6s}
  .arrow:nth-child(3n) .dot{animation-delay:1.2s}
  @keyframes flow{0%{left:0; opacity:0} 15%{opacity:1} 85%{opacity:1} 100%{left:100%; opacity:0}}
  /* A static readout, not a floating tooltip — this box never moves, so it is a
     panel and not .demo-tooltip (which is position:fixed). */
  .readout{margin-top:18px; padding:12px 14px; border-radius:var(--radius-lg);
    background:var(--background-secondary); border:1px solid var(--border-color);
    font-size:13px; min-height:48px}
  .readout b{color:var(--text-accent-dataviz)}
  @media (max-width:560px){
    .node{width:48px; height:48px; font-size:20px}
    .label{font-size:10px} .sub{font-size:10px; min-height:36px}
    .arrow{flex:0 0 16px}
  }
  /* demo.css neutralises the animation globally; that freeze alone would park
     the decorative dot at the arrow's start, so remove it entirely. */
  @media (prefers-reduced-motion: reduce){ .dot{display:none} }
</style>
</head>
<body>
  <h1 class="demo-title">Пайплайн Telegram-отчёта</h1>
  <p class="demo-lede">Понедельник 09:00 → пять этапов. Наведите на блок, чтобы увидеть detail.</p>

  <div class="flow" id="flow"></div>
  <div class="readout" id="tip"><b>Хранилище</b> — наведите на этап, чтобы увидеть его роль.</div>

<script>
const STAGES = [
  {icon:"🗄️", name:"Хранилище", role:"DWH / PostgreSQL. Источник сырых событий и агрегатов. Бот читает, не пишет."},
  {icon:"📜", name:"SQL-запросы", role:"Заранее согласованные запросы в репозитории, ревьюятся как код. WoW и YoY считаются здесь."},
  {icon:"🧮", name:"Форматирование", role:"Сборка компактного сообщения: 5–7 метрик, бейджи ▲▼, HTML-разметка под Telegram."},
  {icon:"🤖", name:"Telegram API", role:"telebot.send_message в канал. Фолбэк при ошибке — явное сообщение, не молчание."},
  {icon:"📢", name:"Канал", role:"@team_metrics. Отчёт лежит там, где команда уже сидит. /report — ручной запрос."}
];

const flow = document.getElementById("flow");
const tip = document.getElementById("tip");

STAGES.forEach((s, i)=>{
  const st = document.createElement("div");
  st.className = "stage";
  st.innerHTML = '<div class="node">'+s.icon+'</div>'+
    '<div class="label">'+s.name+'</div>'+
    '<div class="sub">'+(i===0?"источник":i===STAGES.length-1?"приёмник":"шаг "+i)+'</div>';
  st.addEventListener("mouseenter", ()=>{
    tip.innerHTML = "<b>"+s.name+"</b> — "+s.role;
  });
  flow.appendChild(st);
  if (i < STAGES.length-1){
    const ar = document.createElement("div");
    ar.className = "arrow";
    ar.innerHTML = '<span class="dot"></span>';
    flow.appendChild(ar);
  }
});
</script>
</body>
</html>
