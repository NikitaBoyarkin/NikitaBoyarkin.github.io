<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Когортная матрица удержания</title>
<meta name="theme-color" content="#0f2a2b">
<script src="/demos/demo-theme.js"></script>
<link rel="stylesheet" href="/demos/demo.css">
<style>
  /* Layout only. Colour, type family, radii, shadows and the wallpaper come
     from /demos/demo.css, which is also what makes this page follow the site's
     three themes. */
  .matrix{
    display:grid;
    grid-template-columns: 76px repeat(7, 1fr);
    gap:4px;
    max-width:620px;
  }
  .col-head, .row-head{
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--dv-label);
    padding:6px 0;
  }
  .row-head{justify-content:flex-start; padding-left:var(--space-2)}
  .cell{
    position:relative; border-radius:var(--radius-sm); min-height:46px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600;
    /* The one ink that sits inside a ramp step; theme-invariant, because the
       whole ramp lives in the light half of the luminance range. */
    color:var(--dv-cell-ink);
    cursor:default; transition:transform .12s ease, box-shadow .12s ease;
  }
  .cell.empty{
    background:var(--background-tertiary); color:var(--dv-label);
    font-weight:400; font-size:14px;
  }
  .cell.data:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px var(--shadow-color);
    /* Lift above the sibling cells whose shadows it would otherwise sit under. */
    z-index:var(--z-float);
  }
  .ytitle{
    grid-column:1; grid-row:1 / span 8; writing-mode:vertical-rl;
    transform:rotate(180deg); display:flex; align-items:center;
    justify-content:center; font-size:11px; color:var(--dv-label); font-weight:600;
  }
  .xtitle{
    grid-column:2 / span 7; grid-row: 9; text-align:center;
    font-size:11px; color:var(--dv-label); font-weight:600; padding-top:var(--space-2);
  }
  .legend{
    margin-top:14px; display:flex; align-items:center; gap:10px;
    font-size:12px; color:var(--dv-label);
  }
  .scale{display:flex; height:12px; width:180px; border-radius:3px; overflow:hidden}
  @media (max-width:520px){
    .cell{min-height:38px; font-size:10px}
    .row-head{font-size:10px; padding-left:4px}
  }

  /* The seven sequential steps, applied by class rather than inline style so
     they re-resolve on a theme change with no JavaScript at all. */
  .seq-1{background:var(--dv-seq-1)}   .seq-2{background:var(--dv-seq-2)}
  .seq-3{background:var(--dv-seq-3)}   .seq-4{background:var(--dv-seq-4)}
  .seq-5{background:var(--dv-seq-5)}   .seq-6{background:var(--dv-seq-6)}
  .seq-7{background:var(--dv-seq-7)}
</style>
</head>
<body>
  <h1 class="demo-title">Когортная матрица удержания</h1>
  <p class="demo-lede">Строки — месячные когорты, столбцы — месяц с момента старта (M0…M6). Пустые ячейки справа — будущее, его ещё нет. Наведите на ячейку.</p>

  <div class="matrix" id="matrix"></div>
  <div class="legend">
    <span>0%</span>
    <div class="scale" id="scale"></div>
    <span>100%</span>
  </div>
  <div class="demo-tooltip" id="tip"></div>

<script>
// Строки: когорты (янв…июл 2025). Столбцы: M0..M6. null — период не наступил.
const ROWS = [
  {c:"Янв 2025", v:[100, 42, 33, 28, 26, 25, 24]},
  {c:"Фев 2025", v:[100, 40, 32, 27, 25, 24, null]},
  {c:"Мар 2025", v:[100, 45, 35, 30, 28, 27, null]},
  {c:"Апр 2025", v:[100, 48, 38, 32, 30, null, null]},
  {c:"Май 2025", v:[100, 50, 40, 34, null, null, null]},
  {c:"Июн 2025", v:[100, 52, 42, null, null, null, null]},
  {c:"Июл 2025", v:[100, 55, null, null, null, null, null]},
];
const PERIODS = ["M0","M1","M2","M3","M4","M5","M6"];

// Ретеншн → шаг последовательной шкалы. Семь шагов демо-палитры вместо
// интерполяции rgb() на месте: шкала задана токенами (--dv-seq-1..7), поэтому
// она контрастно проверена в каждой теме, а её светлый конец гарантирует, что
// один тёмный ink читается внутри любой ячейки.
function seqClass(ret){
  const step = Math.min(6, Math.round(Math.min(1, ret/100) * 6));
  return "seq-" + (step + 1);
}

const m = document.getElementById("matrix");

// Y title
const yt = document.createElement("div");
yt.className = "ytitle";
yt.textContent = "Когорта →";
m.appendChild(yt);

// Заголовки столбцов
const corner = document.createElement("div");
corner.className = "row-head";
corner.textContent = "";
m.appendChild(corner);
PERIODS.forEach(p=>{
  const h = document.createElement("div");
  h.className = "col-head";
  h.textContent = p;
  m.appendChild(h);
});

// Строки
ROWS.forEach(row=>{
  const rh = document.createElement("div");
  rh.className = "row-head";
  rh.textContent = row.c;
  m.appendChild(rh);
  row.v.forEach((val, i)=>{
    const cell = document.createElement("div");
    if (val === null){
      cell.className = "cell empty";
      cell.textContent = "—";
    } else {
      cell.className = "cell data " + seqClass(val);
      cell.textContent = val + "%";
      cell.dataset.cohort = row.c;
      cell.dataset.period = PERIODS[i];
      cell.dataset.val = val;
    }
    m.appendChild(cell);
  });
});

// X title
const xt = document.createElement("div");
xt.className = "xtitle";
xt.textContent = "← Месяц с момента старта";
m.appendChild(xt);

// Шкала легенды
const scale = document.getElementById("scale");
for (let i=0; i<=20; i++){
  const s = document.createElement("div");
  s.style.flex = "1";
  s.className = seqClass(i*5);
  scale.appendChild(s);
}

// Тултип
const tip = document.getElementById("tip");
m.addEventListener("mouseover", e=>{
  const c = e.target.closest(".cell.data");
  if (!c) return;
  const note = c.dataset.period === "M0"
    ? "По определению 100% — база, не сигнал удержания."
    : (parseInt(c.dataset.period.slice(1)) >= 5
       ? "Поздний период: мало когорт, выводы ненадёжны."
       : "Доля когорты, вернувшейся в этот месяц.");
  tip.innerHTML = "<b>"+c.dataset.cohort+"</b> · "+c.dataset.period+
    " — "+c.dataset.val+"% удержания"+
    '<span class="sub">'+note+"</span>";
  tip.classList.add("is-visible");
});
m.addEventListener("mousemove", e=>{
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top  = (e.clientY + 14) + "px";
});
m.addEventListener("mouseout", e=>{
  if (!e.target.closest(".cell.data")) return;
  tip.classList.remove("is-visible");
});
</script>
</body>
</html>
