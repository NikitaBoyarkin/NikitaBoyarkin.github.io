<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта RFM-сегментов</title>
<meta name="theme-color" content="#0f2a2b">
<script src="/demos/demo-theme.js"></script>
<link rel="stylesheet" href="/demos/demo.css">
<style>
  /* Layout only. Colour, type family, radii, shadows and the wallpaper come
     from /demos/demo.css, which is also what makes this page follow the site's
     three themes. */
  :root{ --cell-gap:6px; }

  .board{
    display:grid;
    grid-template-columns: 44px repeat(5, 1fr);
    grid-template-rows: 28px repeat(5, 1fr);
    gap:var(--cell-gap);
    max-width:560px;
  }
  .corner{background:transparent}
  .axis, .row-label{
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--dv-label);
  }
  .cell{
    position:relative; border-radius:var(--radius-md); padding:var(--space-2);
    display:flex; align-items:flex-end; min-height:64px;
    font-size:11px; font-weight:600;
    /* The one ink that sits inside a coloured cell; theme-invariant, because
       every segment colour stays in the light half of the luminance range. */
    color:var(--dv-cell-ink);
    cursor:default;
    box-shadow:inset 0 0 0 1px var(--border-color);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cell:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px var(--shadow-color), inset 0 0 0 1px var(--border-color);
    /* Lift above the sibling cells whose shadows it would otherwise sit under. */
    z-index:var(--z-float);
  }
  .ytitle, .xtitle{
    font-size:11px; color:var(--dv-label); text-align:center; font-weight:600;
  }
  .ytitle{grid-column:1; grid-row:1 / span 6; writing-mode:vertical-rl; transform:rotate(180deg); display:flex; align-items:center; justify-content:center}
  @media (max-width:520px){
    .cell{min-height:54px; font-size:10px}
  }

  /* The eleven segment colours, applied by class rather than inline style so
     they re-resolve on a theme change with no JavaScript at all. Order runs
     best (champions) to worst (lost), matching the legend. */
  .cat-1{background:var(--dv-cat-1)}   .cat-2{background:var(--dv-cat-2)}
  .cat-3{background:var(--dv-cat-3)}   .cat-4{background:var(--dv-cat-4)}
  .cat-5{background:var(--dv-cat-5)}   .cat-6{background:var(--dv-cat-6)}
  .cat-7{background:var(--dv-cat-7)}   .cat-8{background:var(--dv-cat-8)}
  .cat-9{background:var(--dv-cat-9)}   .cat-10{background:var(--dv-cat-10)}
  .cat-11{background:var(--dv-cat-11)}
</style>
</head>
<body>
  <h1 class="demo-title">Карта RFM-сегментов</h1>
  <p class="demo-lede">Сетка 5×5 по давности (R, строки) и частоте (F, столбцы). Наведите на ячейку — сегмент и действие. Сумма (M) уточняет сегмент внутри ячейки.</p>

  <div class="board" id="board"></div>

  <div class="demo-legend" id="legend"></div>
  <div class="demo-tooltip" id="tip"></div>

<script>
// n — индекс в категориальной палитре демо (--dv-cat-1..11), от лучшего
// сегмента к худшему. Цвет здесь — дублирующий канал: имя сегмента в легенде
// и подписи несут смысл, оттенок лишь помогает глазом связать ячейку с легендой.
const SEG = {
  champions:      {n:1,  name:"Чемпионы",          act:"Программа лояльности, ранний доступ, рефералы."},
  loyal:          {n:2,  name:"Лояльные",          act:"Апсейл, награды за повторные покупки."},
  potentialLoyal: {n:3,  name:"Потенциально лояльные", act:"Стимул ко второй покупке, подписка."},
  recent:         {n:4,  name:"Недавние",          act:"Онбординг, приветственная серия."},
  new:            {n:5,  name:"Новички",           act:"Первый повторный оффер."},
  aboutToSleep:   {n:6,  name:"Засыпают",          act:"Реактивация, напоминание о бренде."},
  needAttention:  {n:7,  name:"Требуют внимания",  act:"Персональная акция, опрос причин."},
  atRisk:         {n:8,  name:"В зоне риска",      act:"Win-back, скидка на возврат."},
  cantLose:       {n:9,  name:"Нельзя потерять",   act:"Дорогая реактивация, личный менеджер."},
  hibernating:    {n:10, name:"Спящие",            act:"Дешёвая реактивация или пауза."},
  lost:           {n:11, name:"Потерянные",        act:"Игнорировать или массовая реактивация."}
};

// Матрица: [R][F], R=5..1 (строки сверху вниз), F=1..5 (слева направо)
const M = {
  5: ["new","new","recent","potentialLoyal","champions"],
  4: ["new","recent","potentialLoyal","loyal","loyal"],
  3: ["aboutToSleep","aboutToSleep","needAttention","potentialLoyal","loyal"],
  2: ["hibernating","hibernating","needAttention","atRisk","atRisk"],
  1: ["lost","lost","hibernating","cantLose","cantLose"]
};

const board = document.getElementById("board");
// Заголовок оси Y (вертикально)
const ytitle = document.createElement("div");
ytitle.className = "ytitle";
ytitle.textContent = "Recency →";
board.appendChild(ytitle);

// Верхний левый угол + заголовки столбцов F1..F5
const corner = document.createElement("div");
corner.className = "axis corner";
corner.textContent = "";
board.appendChild(corner);
for (let f=1; f<=5; f++){
  const ax = document.createElement("div");
  ax.className = "axis";
  ax.textContent = "F" + f;
  board.appendChild(ax);
}

// Строки R=5..1
for (let r=5; r>=1; r--){
  const rl = document.createElement("div");
  rl.className = "row-label";
  rl.textContent = "R" + r;
  board.appendChild(rl);
  for (let f=1; f<=5; f++){
    const key = M[r][f-1];
    const seg = SEG[key];
    const cell = document.createElement("div");
    cell.className = "cell cat-" + seg.n;
    cell.dataset.segment = key;
    cell.dataset.r = r;
    cell.dataset.f = f;
    cell.innerHTML = seg.name;
    board.appendChild(cell);
  }
}

// Легенда
const legend = document.getElementById("legend");
Object.keys(SEG).forEach(key=>{
  const s = document.createElement("span");
  s.innerHTML = '<i class="demo-swatch cat-'+SEG[key].n+'"></i>'+SEG[key].name;
  legend.appendChild(s);
});

// Тултип
const tip = document.getElementById("tip");
board.addEventListener("mouseover", e=>{
  const c = e.target.closest(".cell");
  if (!c) return;
  const seg = SEG[c.dataset.segment];
  tip.innerHTML = "<b>"+seg.name+"</b><br>R"+c.dataset.r+" · F"+c.dataset.f+
    '<span class="act">'+seg.act+"</span>";
  tip.classList.add("is-visible");
});
board.addEventListener("mousemove", e=>{
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top  = (e.clientY + 14) + "px";
});
board.addEventListener("mouseout", e=>{
  if (!e.target.closest(".cell")) return;
  tip.classList.remove("is-visible");
});
</script>
</body>
</html>
