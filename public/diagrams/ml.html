<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leakage-free sklearn preprocessing pipeline · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:         #0f2a2b;  /* page bg          */
      --paper-2:       #1a3435;  /* container/cards  */
      --paper-3:       #234044;  /* nested zone      */
      --ink:           #e4e4e7;  /* primary text/stroke */
      --ink-strong:    #1a1a1a;  /* ink ON an accent fill */
      --muted:         #a1a1aa;  /* secondary text + default arrows */
      --soft:          #8f8f99;  /* sublabels, boundary labels */
      --rule:          rgba(228,228,231,0.14);
      --rule-solid:    #3f3f46;
      --accent:        #ff8569;  /* 1–2 focal elements ONLY */
      --accent-tint:   rgba(255,133,105,0.10);
      --accent-strong: #fe4e02;  /* brand orange fill (rare) */
      --link:          #4ecdc4;  /* HTTP/API + external/HITL arrows ONLY */
      --data:          #4ecdc4;  /* chart series only, never an arrow */
      --font-title:    'Cormorant', Georgia, 'Times New Roman', serif;
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono:     'SF Mono', Monaco, 'Cascadia Mono', 'Roboto Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 8px;
    }

    h1 {
      font-family: var(--font-title);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 24px;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

    /* --- diagram surface ------------------------------------------------- */
    .bg { fill: var(--paper); }
    .dots { fill: url(#dots); }
    .lane-tint { fill: rgba(228,228,231,0.025); }
    .rule { stroke: var(--rule); stroke-width: 1; fill: none; }

    /* --- step header ----------------------------------------------------- */
    .step-chip { fill: rgba(228,228,231,0.12); }
    .step-num { font-family: var(--font-mono); font-size: 8px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .step-label { font-family: var(--font-mono); font-size: 8px; font-weight: 500; letter-spacing: 0.12em; fill: var(--muted); text-anchor: middle; }
    .lane-label { font-family: var(--font-mono); font-size: 8px; font-weight: 500; letter-spacing: 0.18em; fill: var(--muted); text-anchor: middle; }

    /* --- the load-bearing fact: the train-only fit boundary zone --------- */
    .zone { fill: var(--paper-3); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 5,4; }
    .zone-label { font-family: var(--font-mono); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; fill: var(--soft); }
    .zone-swatch { fill: var(--paper-3); stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3,2; }

    /* --- node treatments ------------------------------------------------- */
    .node-mask { fill: var(--paper); }
    .node { fill: rgba(228,228,231,0.04); stroke: rgba(228,228,231,0.20); stroke-width: 1; }
    .role-chip { fill: rgba(228,228,231,0.12); }
    .role { font-family: var(--font-mono); font-size: 7px; font-weight: 600; letter-spacing: 0.08em; fill: var(--ink); text-anchor: middle; }
    .node-name { font-family: var(--font-sans); font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .node-sub { font-family: var(--font-mono); font-size: 9px; font-weight: 400; fill: var(--muted); text-anchor: middle; }
    .chip-db { fill: #5e7a9b; }
    .chip-tb { fill: #b8915a; }
    .chip-fl { fill: #9c6b50; }
    .chip-txt { font-family: var(--font-mono); font-size: 6px; font-weight: 700; fill: #ffffff; text-anchor: middle; }

    /* --- connectors ------------------------------------------------------ */
    .a-muted { stroke: var(--muted); stroke-width: 1; fill: none; }
    .a-accent { stroke: var(--accent); stroke-width: 1.2; fill: none; }
    .a-forbidden { stroke: var(--soft); stroke-width: 1; fill: none; stroke-dasharray: 5,4; }
    .al { font-family: var(--font-mono); font-size: 8px; font-weight: 400; letter-spacing: 0.06em; fill: var(--soft); }

    /* --- legend ---------------------------------------------------------- */
    .legend-cat { font-family: var(--font-mono); font-size: 8px; font-weight: 500; letter-spacing: 0.18em; fill: var(--muted); }
    .legend-txt { font-family: var(--font-mono); font-size: 8px; font-weight: 400; fill: var(--muted); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · ML fundamentals</p>
    <h1>Leakage-free sklearn preprocessing pipeline</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ml-title ml-desc">
        <title id="ml-title">Leakage-free sklearn preprocessing pipeline</title>
        <desc id="ml-desc">A raw dataset is split deterministically into train and held-out rows; inside one boundary zone the imputer, scaler and one-hot encoder are fitted on the train split only, the fitted transform feeds model training, and the held-out rows are scored — with a blocked dashed path showing that test rows can never enter the fit.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(228,228,231,0.07)"/></pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a1a1aa"/></marker>
          <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff8569"/></marker>
          <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ecdc4"/></marker>
        </defs>

        <!-- Ground -->
        <rect width="1280" height="720" class="bg"/>
        <rect width="1280" height="720" class="dots"/>
        <rect x="0" y="228" width="1280" height="140" class="lane-tint"/>

        <!-- Lane structure -->
        <line x1="40" y1="88" x2="1240" y2="88" class="rule"/>
        <line x1="40" y1="228" x2="1240" y2="228" class="rule"/>
        <line x1="40" y1="368" x2="1240" y2="368" class="rule"/>
        <line x1="40" y1="508" x2="1240" y2="508" class="rule"/>
        <line x1="40" y1="648" x2="1240" y2="648" class="rule"/>
        <line x1="184" y1="88" x2="184" y2="648" class="rule"/>

        <!-- Boundary zone: containers paint first, behind every node and line -->
        <rect x="532" y="236" width="536" height="124" rx="8" class="zone"/>
        <text x="546" y="250" class="zone-label">COLUMNTRANSFORMER · FIT ON TRAIN ONLY</text>

        <!-- Step header -->
        <rect x="256" y="48" width="32" height="16" rx="6" class="step-chip"/><text x="272" y="59" class="step-num">01</text><text x="272" y="80" class="step-label">LOAD</text>
        <rect x="432" y="48" width="32" height="16" rx="6" class="step-chip"/><text x="448" y="59" class="step-num">02</text><text x="448" y="80" class="step-label">SPLIT</text>
        <rect x="608" y="48" width="32" height="16" rx="6" class="step-chip"/><text x="624" y="59" class="step-num">03</text><text x="624" y="80" class="step-label">IMPUTE</text>
        <rect x="784" y="48" width="32" height="16" rx="6" class="step-chip"/><text x="800" y="59" class="step-num">04</text><text x="800" y="80" class="step-label">SCALE</text>
        <rect x="960" y="48" width="32" height="16" rx="6" class="step-chip"/><text x="976" y="59" class="step-num">05</text><text x="976" y="80" class="step-label">ENCODE</text>
        <rect x="1136" y="48" width="32" height="16" rx="6" class="step-chip"/><text x="1152" y="59" class="step-num">06</text><text x="1152" y="80" class="step-label">FIT · SCORE</text>

        <!-- Lane labels: the README's 10-row dataset and its 80/20 split -->
        <text x="112" y="154" class="lane-label">RAW DATA</text><text x="112" y="166" class="lane-label">10 ROWS</text>
        <text x="112" y="294" class="lane-label">TRAIN SPLIT</text><text x="112" y="306" class="lane-label">8 ROWS</text>
        <text x="112" y="434" class="lane-label">MODEL</text><text x="112" y="446" class="lane-label">FITTING</text>
        <text x="112" y="574" class="lane-label">TEST SPLIT</text><text x="112" y="586" class="lane-label">2 ROWS</text>

        <!-- Connectors: drawn before the boxes so the lines sit behind the nodes -->
        <line x1="348" y1="158" x2="372" y2="158" class="a-muted" marker-end="url(#arr-muted)"/>
        <path d="M500 196 V290 Q500 298 508 298 H548" class="a-accent" marker-end="url(#arr-accent)"/>
        <line x1="400" y1="196" x2="400" y2="540" class="a-muted" marker-end="url(#arr-muted)"/>
        <line x1="700" y1="298" x2="724" y2="298" class="a-muted" marker-end="url(#arr-muted)"/>
        <line x1="876" y1="298" x2="900" y2="298" class="a-muted" marker-end="url(#arr-muted)"/>
        <path d="M976 336 V430 Q976 438 984 438 H1076" class="a-muted" marker-end="url(#arr-muted)"/>
        <line x1="524" y1="568" x2="1076" y2="568" class="a-muted" marker-end="url(#arr-muted)"/>
        <line x1="1152" y1="476" x2="1152" y2="540" class="a-muted" marker-end="url(#arr-muted)"/>
        <path d="M480 540 V388 Q480 380 488 380 H552 Q560 380 560 372 V360" class="a-forbidden" marker-end="url(#arr-muted)"/>

        <!-- Arrow labels: opaque masks, 6px clear of the stroke -->
        <rect x="434" y="244" width="60" height="12" rx="2" class="node-mask"/>
        <text x="464" y="253" class="al" text-anchor="middle">TRAIN ONLY</text>
        <rect x="498" y="386" width="58" height="12" rx="2" class="node-mask"/>
        <text x="527" y="395" class="al" text-anchor="middle">NEVER FIT</text>

        <!-- Nodes: mask, box, role chip, name, sublabel, data-type chips -->
        <rect x="196" y="120" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="196" y="120" width="152" height="76" rx="6" class="node"/>
        <rect x="204" y="128" width="24" height="12" rx="2" class="role-chip"/><text x="216" y="136" class="role">SRC</text>
        <text x="272" y="158" class="node-name">Data.csv</text>
        <text x="272" y="174" class="node-sub">10 rows · 5 cols</text>
        <rect x="316" y="180" width="24" height="12" rx="2" class="chip-db"/><text x="328" y="186" class="chip-txt">DB</text>

        <rect x="372" y="120" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="372" y="120" width="152" height="76" rx="6" class="node"/>
        <rect x="380" y="128" width="24" height="12" rx="2" class="role-chip"/><text x="392" y="136" class="role">SPL</text>
        <text x="448" y="158" class="node-name">Deterministic Split</text>
        <text x="448" y="174" class="node-sub">stable sort · every 5th</text>
        <rect x="380" y="180" width="24" height="12" rx="2" class="chip-db"/><text x="392" y="186" class="chip-txt">DB</text>
        <rect x="492" y="180" width="24" height="12" rx="2" class="chip-db"/><text x="504" y="186" class="chip-txt">DB</text>

        <rect x="548" y="260" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="548" y="260" width="152" height="76" rx="6" class="node"/>
        <rect x="556" y="268" width="24" height="12" rx="2" class="role-chip"/><text x="568" y="276" class="role">NUM</text>
        <text x="624" y="298" class="node-name">SimpleImputer</text>
        <text x="624" y="314" class="node-sub">mean · numeric cols</text>
        <rect x="556" y="320" width="24" height="12" rx="2" class="chip-db"/><text x="568" y="326" class="chip-txt">DB</text>
        <rect x="668" y="320" width="24" height="12" rx="2" class="chip-tb"/><text x="680" y="326" class="chip-txt">TB</text>

        <rect x="724" y="260" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="724" y="260" width="152" height="76" rx="6" class="node"/>
        <rect x="732" y="268" width="24" height="12" rx="2" class="role-chip"/><text x="744" y="276" class="role">NUM</text>
        <text x="800" y="298" class="node-name">StandardScaler</text>
        <text x="800" y="314" class="node-sub">numeric columns only</text>
        <rect x="732" y="320" width="24" height="12" rx="2" class="chip-tb"/><text x="744" y="326" class="chip-txt">TB</text>
        <rect x="844" y="320" width="24" height="12" rx="2" class="chip-tb"/><text x="856" y="326" class="chip-txt">TB</text>

        <rect x="900" y="260" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="900" y="260" width="152" height="76" rx="6" class="node"/>
        <rect x="908" y="268" width="24" height="12" rx="2" class="role-chip"/><text x="920" y="276" class="role">CAT</text>
        <text x="976" y="298" class="node-name">OneHotEncoder</text>
        <text x="976" y="314" class="node-sub">cat features · y label</text>
        <rect x="908" y="320" width="24" height="12" rx="2" class="chip-tb"/><text x="920" y="326" class="chip-txt">TB</text>
        <rect x="1020" y="320" width="24" height="12" rx="2" class="chip-tb"/><text x="1032" y="326" class="chip-txt">TB</text>

        <rect x="1076" y="400" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="1076" y="400" width="152" height="76" rx="6" class="node"/>
        <rect x="1084" y="408" width="24" height="12" rx="2" class="role-chip"/><text x="1096" y="416" class="role">MOD</text>
        <text x="1152" y="438" class="node-name">Model Fit</text>
        <text x="1152" y="454" class="node-sub">on transformed train</text>
        <rect x="1084" y="460" width="24" height="12" rx="2" class="chip-tb"/><text x="1096" y="466" class="chip-txt">TB</text>
        <rect x="1184" y="460" width="24" height="12" rx="2" class="chip-fl"/><text x="1196" y="466" class="chip-txt">FL</text>

        <rect x="372" y="540" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="372" y="540" width="152" height="76" rx="6" class="node"/>
        <rect x="380" y="548" width="24" height="12" rx="2" class="role-chip"/><text x="392" y="556" class="role">TST</text>
        <text x="448" y="578" class="node-name">Held-out Test</text>
        <text x="448" y="594" class="node-sub">2 rows · 5 cols</text>
        <rect x="380" y="600" width="24" height="12" rx="2" class="chip-db"/><text x="392" y="606" class="chip-txt">DB</text>
        <rect x="492" y="600" width="24" height="12" rx="2" class="chip-db"/><text x="504" y="606" class="chip-txt">DB</text>

        <rect x="1076" y="540" width="152" height="76" rx="6" class="node-mask"/>
        <rect x="1076" y="540" width="152" height="76" rx="6" class="node"/>
        <rect x="1084" y="548" width="24" height="12" rx="2" class="role-chip"/><text x="1096" y="556" class="role">EVA</text>
        <text x="1152" y="578" class="node-name">Test Scoring</text>
        <text x="1152" y="594" class="node-sub">transform · predict</text>
        <rect x="1084" y="600" width="24" height="12" rx="2" class="chip-db"/><text x="1096" y="606" class="chip-txt">DB</text>
        <rect x="1184" y="600" width="24" height="12" rx="2" class="chip-fl"/><text x="1196" y="606" class="chip-txt">FL</text>

        <!-- Legend: horizontal strip inside the reserved bottom 60px -->
        <line x1="40" y1="660" x2="1240" y2="660" class="rule"/>
        <text x="40" y="676" class="legend-cat">NODE</text>
        <rect x="100" y="664" width="16" height="12" rx="2" class="node"/>
        <text x="124" y="676" class="legend-txt">PIPELINE STAGE</text>
        <rect x="256" y="664" width="16" height="12" rx="2" class="zone-swatch"/>
        <text x="280" y="676" class="legend-txt">TRAIN-ONLY FIT ZONE</text>

        <text x="40" y="696" class="legend-cat">DATA</text>
        <rect x="100" y="688" width="24" height="12" rx="2" class="chip-db"/><text x="112" y="692" class="chip-txt">DB</text>
        <text x="132" y="696" class="legend-txt">DATASET</text>
        <rect x="240" y="688" width="24" height="12" rx="2" class="chip-tb"/><text x="252" y="692" class="chip-txt">TB</text>
        <text x="272" y="696" class="legend-txt">TABLE</text>
        <rect x="380" y="688" width="24" height="12" rx="2" class="chip-fl"/><text x="392" y="692" class="chip-txt">FL</text>
        <text x="412" y="696" class="legend-txt">EXPORT</text>
        <text x="560" y="696" class="legend-txt">LEFT CHIP = INPUT · RIGHT CHIP = OUTPUT</text>

        <text x="40" y="714" class="legend-cat">FLOW</text>
        <line x1="100" y1="708" x2="124" y2="708" class="a-muted" marker-end="url(#arr-muted)"/>
        <text x="132" y="714" class="legend-txt">DATA HANDOFF</text>
        <line x1="256" y1="708" x2="280" y2="708" class="a-forbidden" marker-end="url(#arr-muted)"/>
        <text x="288" y="714" class="legend-txt">BOUNDARY · TEST CANNOT FIT</text>
      </svg>
    </div>
  </main>
</body>
</html>
