<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Python analytics pipeline: load, clean, EDA, viz, pipeline">
  <defs>
    <linearGradient id="python-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="python-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#python-bg)"/>

  <!-- pipeline stages -->
  <rect x="80" y="160" width="160" height="180" rx="18" fill="#3f3f46"/>
  <rect x="280" y="160" width="160" height="180" rx="18" fill="#3f3f46"/>
  <rect x="480" y="160" width="160" height="180" rx="18" fill="#3f3f46"/>
  <rect x="680" y="160" width="160" height="180" rx="18" fill="#3f3f46"/>
  <rect x="880" y="160" width="240" height="180" rx="18" fill="url(#python-accent)"/>

  <g font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" text-anchor="middle">
    <text x="160" y="266" fill="#e4e4e7">Load</text>
    <text x="360" y="266" fill="#e4e4e7">Clean</text>
    <text x="560" y="266" fill="#e4e4e7">EDA</text>
    <text x="760" y="266" fill="#e4e4e7">Viz</text>
    <text x="1000" y="266" fill="#0f2a2b">Pipeline</text>
  </g>

  <!-- flow chevrons -->
  <g fill="#ffa68a">
    <path d="M250,235 L270,250 L250,265 Z"/>
    <path d="M450,235 L470,250 L450,265 Z"/>
    <path d="M650,235 L670,250 L650,265 Z"/>
    <path d="M850,235 L870,250 L850,265 Z"/>
  </g>

  <!-- coverage badge -->
  <line x1="1000" y1="350" x2="1000" y2="390" stroke="#234044" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="880" y="400" width="240" height="100" rx="18" fill="none" stroke="#234044" stroke-width="4"/>
  <text x="1000" y="465" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="500" fill="#ffa68a" text-anchor="middle">&#8805; 80%</text>
</svg>
