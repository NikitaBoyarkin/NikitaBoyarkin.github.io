<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subscription funnel 12,000 to 9,623 to 3,384 with an A/B lift on activation to paid, and a comparison of the conversion and retention levers on LTV">
  <defs>
    <linearGradient id="paf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="paf-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d2573a"/>
      <stop offset="1" stop-color="#a8331a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#f8f2d8"/>

  <text x="80" y="120" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" letter-spacing="1" fill="#0f2a2b">FUNNEL × A/B</text>

  <!-- funnel stages: 12000 -> 9623 -> 3384 -->
  <polygon points="80,180 760,180 700,300 140,300" fill="#4a6b69" fill-opacity="0.16" stroke="#4a6b69" stroke-width="3"/>
  <polygon points="140,310 700,310 640,420 200,420" fill="#4a6b69" fill-opacity="0.24" stroke="#4a6b69" stroke-width="3"/>
  <polygon points="200,430 640,430 580,530 260,530" fill="url(#paf-accent)" fill-opacity="0.28" stroke="#a8331a" stroke-width="3"/>

  <text x="420" y="252" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#0f2a2b" text-anchor="middle">12 000</text>
  <text x="420" y="376" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#0f2a2b" text-anchor="middle">9 623</text>
  <text x="420" y="494" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#a8331a" text-anchor="middle">3 384</text>

  <!-- levers at an equal +10% step -->
  <line x1="800" y1="180" x2="800" y2="530" stroke="#0f2a2b" stroke-width="3" stroke-opacity="0.25"/>

  <rect x="860" y="360" width="90" height="170" fill="url(#paf-accent)" rx="6"/>
  <rect x="1020" y="385" width="90" height="145" fill="#4a6b69" fill-opacity="0.55" rx="6"/>

  <text x="905" y="340" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#a8331a" text-anchor="middle">+10.00%</text>
  <text x="1065" y="365" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600" fill="#4a6b69" text-anchor="middle">+8.65%</text>
  <text x="905" y="565" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#0f2a2b" text-anchor="middle">CONVERSION</text>
  <text x="1065" y="565" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#4a6b69" text-anchor="middle">RETENTION</text>
</svg>
