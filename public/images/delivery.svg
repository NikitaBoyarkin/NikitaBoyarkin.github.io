<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Delivery Control Tower: данные, витрины, прогноз заказов и узкие места доставки">
  <rect width="1200" height="600" fill="#f8f2d8"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#d8c9a0"/>

  <text x="80" y="96" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="2" fill="#0f2a2b">DELIVERY CONTROL TOWER</text>
  <text x="80" y="140" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#4a6b69">операционная аналитика доставки · 550 710 строк · 264 города</text>

  <!-- pipeline: data → marts → forecast → dashboard -->
  <g>
    <rect x="80" y="178" width="245" height="104" rx="10" fill="#fdf8e6" stroke="#d8c9a0"/>
    <text x="102" y="216" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" fill="#0f2a2b">Данные</text>
    <text x="102" y="252" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#4a6b69">день×город×канал</text>

    <path d="M330 224 L338 230 L330 236" fill="none" stroke="#8a7a50" stroke-width="2"/>

    <rect x="345" y="178" width="245" height="104" rx="10" fill="#fdf8e6" stroke="#d8c9a0"/>
    <text x="367" y="216" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" fill="#0f2a2b">Витрины</text>
    <text x="367" y="252" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#4a6b69">star-schema</text>

    <path d="M595 224 L603 230 L595 236" fill="none" stroke="#8a7a50" stroke-width="2"/>

    <rect x="610" y="178" width="245" height="104" rx="10" fill="#fdf8e6" stroke="#d8c9a0"/>
    <text x="632" y="216" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" fill="#0f2a2b">Прогноз</text>
    <text x="632" y="252" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#4a6b69">WAPE 6.01% · h=7</text>

    <path d="M860 224 L868 230 L860 236" fill="none" stroke="#8a7a50" stroke-width="2"/>

    <rect x="875" y="178" width="245" height="104" rx="10" fill="#fdf8e6" stroke="#d8c9a0"/>
    <text x="897" y="216" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" fill="#0f2a2b">Дашборд</text>
    <text x="897" y="252" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#4a6b69">офлайн · 3 роли</text>
  </g>

  <!-- forecast panel: WAPE by model at h=7 -->
  <g>
    <rect x="80" y="310" width="500" height="250" rx="12" fill="#fdf8e6" stroke="#d8c9a0"/>
    <text x="104" y="350" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#0f2a2b">Прогноз заказов, WAPE h=7</text>

    <g stroke="#e3d9bb" stroke-width="1">
      <path d="M104 404 H556"/><path d="M104 454 H556"/><path d="M104 504 H556"/>
    </g>
    <g font-family="Inter, system-ui, sans-serif" font-size="22">
      <text x="104" y="399" fill="#4a6b69">10%</text>
      <text x="104" y="449" fill="#4a6b69">5%</text>
      <text x="104" y="499" fill="#4a6b69">0</text>
    </g>

    <g>
      <rect x="150" y="400" width="64" height="125" rx="4" fill="#c9b98a"/>
      <rect x="252" y="465" width="64" height="60" rx="4" fill="#a8331a"/>
      <rect x="354" y="453" width="64" height="72" rx="4" fill="#4a6b69"/>
      <rect x="456" y="446" width="64" height="79" rx="4" fill="#0f2a2b"/>
    </g>

    <g font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
      <text x="182" y="392" fill="#0f2a2b">12.53</text>
      <text x="284" y="457" fill="#0f2a2b">6.01</text>
      <text x="386" y="445" fill="#0f2a2b">7.16</text>
      <text x="488" y="438" fill="#0f2a2b">7.90</text>
    </g>

    <g font-family="Inter, system-ui, sans-serif" font-size="22" text-anchor="middle">
      <text x="182" y="550" fill="#4a6b69">naive</text>
      <text x="284" y="550" fill="#4a6b69">сезон</text>
      <text x="386" y="550" fill="#4a6b69">HW</text>
      <text x="488" y="550" fill="#4a6b69">hgb</text>
    </g>
  </g>

  <!-- bottlenecks panel: mean delivery time by category -->
  <g>
    <rect x="620" y="310" width="500" height="250" rx="12" fill="#fdf8e6" stroke="#d8c9a0"/>
    <text x="644" y="350" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#0f2a2b">Время по категориям, мин</text>

    <g font-family="Inter, system-ui, sans-serif" font-size="22">
      <text x="644" y="392" fill="#0f2a2b">закуски</text>
      <text x="644" y="434" fill="#4a6b69">напитки</text>
      <text x="644" y="476" fill="#4a6b69">пицца</text>
      <text x="644" y="518" fill="#4a6b69">десерты</text>
    </g>

    <g>
      <rect x="790" y="376" width="270" height="22" rx="4" fill="#0f2a2b"/>
      <rect x="790" y="418" width="205" height="22" rx="4" fill="#4a6b69"/>
      <rect x="790" y="460" width="181" height="22" rx="4" fill="#a8331a"/>
      <rect x="790" y="502" width="171" height="22" rx="4" fill="#c9b98a"/>
    </g>

    <g font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600">
      <text x="1068" y="394" fill="#0f2a2b">40.0</text>
      <text x="1003" y="436" fill="#0f2a2b">30.0</text>
      <text x="979" y="478" fill="#0f2a2b">26.5</text>
      <text x="969" y="520" fill="#0f2a2b">25.0</text>
    </g>
  </g>
</svg>
