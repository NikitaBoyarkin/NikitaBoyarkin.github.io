<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cohort retention: triangular heatmap matrix by cohort and period">
  <defs>
    <linearGradient id="cohort-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#cohort-bg)"/>

  <text x="600" y="140" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#e4e4e7" text-anchor="middle">COHORT RETENTION</text>

  <!-- triangular heatmap: rows = cohorts, cols = periods, fading right and down -->
  <g>
    <rect x="176" y="176" width="72" height="32" rx="6" fill="#ff8569"/>
    <rect x="256" y="176" width="72" height="32" rx="6" fill="#ff6643" opacity="0.85"/>
    <rect x="336" y="176" width="72" height="32" rx="6" fill="#ff6643" opacity="0.65"/>
    <rect x="416" y="176" width="72" height="32" rx="6" fill="#ff6643" opacity="0.55"/>
    <rect x="496" y="176" width="72" height="32" rx="6" fill="#ff6643" opacity="0.42"/>
    <rect x="576" y="176" width="72" height="32" rx="6" fill="#ff6643" opacity="0.32"/>
    <rect x="656" y="176" width="72" height="32" rx="6" fill="#ff6643" opacity="0.24"/>
    <rect x="736" y="176" width="72" height="32" rx="6" fill="#ff6643" opacity="0.18"/>

    <rect x="176" y="216" width="72" height="32" rx="6" fill="#ff8569"/>
    <rect x="256" y="216" width="72" height="32" rx="6" fill="#ff6643" opacity="0.85"/>
    <rect x="336" y="216" width="72" height="32" rx="6" fill="#ff6643" opacity="0.65"/>
    <rect x="416" y="216" width="72" height="32" rx="6" fill="#ff6643" opacity="0.55"/>
    <rect x="496" y="216" width="72" height="32" rx="6" fill="#ff6643" opacity="0.42"/>
    <rect x="576" y="216" width="72" height="32" rx="6" fill="#ff6643" opacity="0.32"/>
    <rect x="656" y="216" width="72" height="32" rx="6" fill="#ff6643" opacity="0.24"/>

    <rect x="176" y="256" width="72" height="32" rx="6" fill="#ff8569"/>
    <rect x="256" y="256" width="72" height="32" rx="6" fill="#ff6643" opacity="0.85"/>
    <rect x="336" y="256" width="72" height="32" rx="6" fill="#ff6643" opacity="0.65"/>
    <rect x="416" y="256" width="72" height="32" rx="6" fill="#ff6643" opacity="0.55"/>
    <rect x="496" y="256" width="72" height="32" rx="6" fill="#ff6643" opacity="0.42"/>
    <rect x="576" y="256" width="72" height="32" rx="6" fill="#ff6643" opacity="0.32"/>

    <rect x="176" y="296" width="72" height="32" rx="6" fill="#ff8569"/>
    <rect x="256" y="296" width="72" height="32" rx="6" fill="#ff6643" opacity="0.85"/>
    <rect x="336" y="296" width="72" height="32" rx="6" fill="#ff6643" opacity="0.65"/>
    <rect x="416" y="296" width="72" height="32" rx="6" fill="#ff6643" opacity="0.55"/>
    <rect x="496" y="296" width="72" height="32" rx="6" fill="#ff6643" opacity="0.42"/>

    <rect x="176" y="336" width="72" height="32" rx="6" fill="#ff8569"/>
    <rect x="256" y="336" width="72" height="32" rx="6" fill="#ff6643" opacity="0.85"/>
    <rect x="336" y="336" width="72" height="32" rx="6" fill="#ff6643" opacity="0.65"/>
    <rect x="416" y="336" width="72" height="32" rx="6" fill="#ff6643" opacity="0.55"/>

