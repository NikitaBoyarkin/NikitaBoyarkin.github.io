  <!-- axis labels -->
  <text x="100" y="332" transform="rotate(-90 100 332)" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" fill="#a1a1aa" text-anchor="middle">COHORT</text>
  <text x="492" y="540" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" fill="#a1a1aa" text-anchor="middle">PERIOD</text>

  <!-- LTV curve overlay -->
