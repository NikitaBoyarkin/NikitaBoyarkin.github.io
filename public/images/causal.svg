<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CUPED narrows the confidence interval and uplift recovers the segment effect">
  <defs>
    <linearGradient id="causal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="causal-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#causal-bg)"/>

  <line x1="600" y1="100" x2="600" y2="520" stroke="#234044" stroke-width="4"/>

  <g font-family="Inter, system-ui, sans-serif">
    <!-- CUPED: same ATE, narrower CI -->
    <text x="80" y="140" font-size="64" font-weight="700" letter-spacing="1" fill="#ff8569">CUPED</text>

    <text x="80" y="220" font-size="44" font-weight="600" fill="#e4e4e7">naive</text>
    <rect x="80" y="240" width="300" height="80" rx="6" fill="#3f3f46"/>
    <text x="400" y="295" font-size="40" font-weight="500" fill="#a1a1aa">0.076</text>

    <text x="80" y="400" font-size="44" font-weight="600" fill="#e4e4e7">cuped</text>
    <rect x="80" y="420" width="225" height="80" rx="6" fill="url(#causal-accent)"/>
    <text x="325" y="475" font-size="40" font-weight="500" fill="#ffa68a">0.057</text>

    <!-- Uplift recovery by segment -->
    <text x="640" y="140" font-size="64" font-weight="700" letter-spacing="1" fill="#ff8569">Uplift</text>

    <text x="640" y="220" font-size="44" font-weight="600" fill="#e4e4e7">new</text>
    <rect x="640" y="240" width="300" height="80" rx="6" fill="url(#causal-accent)"/>

    <text x="640" y="400" font-size="44" font-weight="600" fill="#e4e4e7">returning</text>
    <rect x="640" y="420" width="30" height="80" rx="6" fill="#3f3f46"/>
  </g>
</svg>
