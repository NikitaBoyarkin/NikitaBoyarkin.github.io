<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Supabase product analytics: Postgres cylinder with Row Level Security shield and an A/B test bar chart">
  <defs>
    <linearGradient id="supabase-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="supabase-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#supabase-bg)"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="80" y="150" font-size="64" font-weight="700" letter-spacing="1" fill="#e4e4e7">Postgres</text>
    <text x="480" y="150" font-size="64" font-weight="700" letter-spacing="1" fill="#e4e4e7">RLS</text>
    <text x="880" y="150" font-size="44" font-weight="600" fill="#e4e4e7">A/B</text>
  </g>

  <!-- Postgres cylinder -->
  <path d="M120,240 L120,440 A140,40 0 0 0 400,440 L400,240 Z" fill="#234044" stroke="#ff8569" stroke-width="4"/>
  <ellipse cx="260" cy="240" rx="140" ry="40" fill="#234044" stroke="#ff8569" stroke-width="4"/>
  <path d="M120,320 Q260,370 400,320" fill="none" stroke="#3f3f46" stroke-width="4"/>
  <path d="M120,390 Q260,440 400,390" fill="none" stroke="#3f3f46" stroke-width="4"/>

  <!-- RLS shield -->
  <path d="M600,220 L720,266 L720,380 Q720,470 600,520 Q480,470 480,380 L480,266 Z" fill="#234044" stroke="url(#supabase-accent)" stroke-width="4"/>

  <!-- A/B -->
  <rect x="880" y="200" width="180" height="80" rx="6" fill="#3f3f46"/>
  <rect x="880" y="300" width="210" height="80" rx="6" fill="url(#supabase-accent)"/>
  <text x="880" y="460" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="500" fill="#ffa68a">+5.1pp</text>
  <text x="880" y="520" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="500" fill="#a1a1aa">p=0.0034</text>
</svg>
