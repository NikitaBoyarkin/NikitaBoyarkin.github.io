<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LinkedIn post analytics: series efficiency bars with 95% bootstrap confidence intervals">
  <defs>
    <linearGradient id="li-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="li-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2573a"/>
      <stop offset="1" stop-color="#a8331a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#f8f2d8"/>

  <text x="80" y="140" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#0f2a2b">LINKEDIN ANALYTICS</text>
  <text x="80" y="176" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="500" fill="#4a6b69">SERIES EFFICIENCY · 95% BOOTSTRAP CI BY POST</text>

  <!-- baseline -->
  <line x1="120" y1="515" x2="1120" y2="515" stroke="#0f2a2b" stroke-opacity="0.22" stroke-width="3"/>

  <!-- bars + confidence intervals. The chart sits 45 units lower than the old
       layout: at the previous height the SWIPE whisker ran through the subtitle
       ("EFFICIENCY") and read as a strike-through. -->
  <g opacity="0.9">
    <rect x="140" y="240" width="100" height="275" rx="10" fill="url(#li-bar)"/>
    <rect x="360" y="271" width="100" height="244" rx="10" fill="url(#li-bar)"/>
    <rect x="580" y="316" width="100" height="199" rx="10" fill="url(#li-bar)"/>
    <rect x="800" y="322" width="100" height="193" rx="10" fill="url(#li-bar)"/>
    <rect x="1020" y="360" width="100" height="155" rx="10" fill="url(#li-bar)"/>
  </g>

  <g stroke="#0f2a2b" stroke-width="4" stroke-linecap="round">
    <line x1="190" y1="196" x2="190" y2="284"/><line x1="172" y1="196" x2="208" y2="196"/><line x1="172" y1="284" x2="208" y2="284"/>
    <line x1="410" y1="260" x2="410" y2="282"/><line x1="392" y1="260" x2="428" y2="260"/><line x1="392" y1="282" x2="428" y2="282"/>
    <line x1="630" y1="244" x2="630" y2="388"/><line x1="612" y1="244" x2="648" y2="244"/><line x1="612" y1="388" x2="648" y2="388"/>
    <line x1="850" y1="282" x2="850" y2="362"/><line x1="832" y1="282" x2="868" y2="282"/><line x1="832" y1="362" x2="868" y2="362"/>
    <line x1="1070" y1="322" x2="1070" y2="398"/><line x1="1052" y1="322" x2="1088" y2="322"/><line x1="1052" y1="398" x2="1088" y2="398"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#4a6b69" text-anchor="middle">
    <text x="190" y="560" fill="#4a6b69">SWIPE</text>
    <text x="410" y="560" fill="#4a6b69">PREP</text>
    <text x="630" y="560" fill="#4a6b69">SOFA</text>
    <text x="850" y="560" fill="#4a6b69">OTHER</text>
    <text x="1070" y="560" fill="#4a6b69">A/B</text>
  </g>
</svg>
