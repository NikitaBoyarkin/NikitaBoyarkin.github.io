  <rect x="564" y="426" width="82" height="16" rx="8" fill="#0f2a2b" fill-opacity="0.28"/>
  <rect x="564" y="452" width="268" height="10" rx="5" fill="#0f2a2b" fill-opacity="0.28"/>
