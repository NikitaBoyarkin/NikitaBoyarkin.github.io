<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scrollytelling: narrative column synced with visualization panels on scroll">
  <defs>
    <linearGradient id="scrolly-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="scrolly-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#scrolly-bg)"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="80" y="120" font-size="64" font-weight="700" letter-spacing="1" fill="#e4e4e7">Narrative</text>
    <text x="640" y="120" font-size="64" font-weight="700" letter-spacing="1" fill="#e4e4e7">Panels</text>
  </g>

  <!-- narrative column -->
  <rect x="80" y="160" width="440" height="380" rx="18" fill="#234044" fill-opacity="0.5"/>

  <!-- scroll progress rail -->
  <line x1="120" y1="200" x2="120" y2="480" stroke="#3f3f46" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="200" x2="120" y2="340" stroke="url(#scrolly-accent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="200" r="8" fill="#ff8569"/>
  <circle cx="120" cy="270" r="8" fill="#ff8569"/>
  <circle cx="120" cy="340" r="20" fill="none" stroke="#ffa68a" stroke-width="4" opacity="0.5"/>
  <circle cx="120" cy="340" r="12" fill="#ff8569"/>
  <circle cx="120" cy="410" r="8" fill="#3f3f46"/>
  <circle cx="120" cy="480" r="8" fill="#3f3f46"/>

  <!-- narrative text lines -->
  <g stroke="#3f3f46" stroke-width="8" stroke-linecap="round">
    <line x1="180" y1="220" x2="480" y2="220"/>
    <line x1="180" y1="270" x2="420" y2="270"/>
    <line x1="180" y1="320" x2="460" y2="320"/>
    <line x1="180" y1="370" x2="400" y2="370"/>
    <line x1="180" y1="420" x2="470" y2="420"/>
    <line x1="180" y1="470" x2="440" y2="470"/>
  </g>

  <!-- active visualization panel -->
  <rect x="640" y="160" width="480" height="260" rx="18" fill="#234044"/>
  <rect x="640" y="160" width="480" height="260" rx="18" fill="none" stroke="url(#scrolly-accent)" stroke-width="4" opacity="0.7"/>
  <g>
    <rect x="690" y="310" width="60" height="70" rx="6" fill="#3f3f46"/>
    <rect x="770" y="280" width="60" height="100" rx="6" fill="#3f3f46"/>
    <rect x="850" y="230" width="60" height="150" rx="6" fill="url(#scrolly-accent)"/>
    <rect x="930" y="260" width="60" height="120" rx="6" fill="#3f3f46"/>
    <rect x="1010" y="220" width="60" height="160" rx="6" fill="url(#scrolly-accent)"/>
    <line x1="690" y1="380" x2="1070" y2="380" stroke="#3f3f46" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- upcoming panels -->
  <rect x="640" y="440" width="480" height="40" rx="18" fill="#234044" fill-opacity="0.45"/>
  <line x1="690" y1="460" x2="1070" y2="460" stroke="#3f3f46" stroke-width="8" stroke-linecap="round"/>
  <rect x="640" y="500" width="480" height="40" rx="18" fill="#234044" fill-opacity="0.3"/>
  <line x1="690" y1="520" x2="980" y2="520" stroke="#3f3f46" stroke-width="8" stroke-linecap="round"/>
</svg>
