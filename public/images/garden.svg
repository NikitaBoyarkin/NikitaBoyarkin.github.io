<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital garden: linked notes graph network">
  <defs>
    <linearGradient id="garden-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="garden-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#garden-bg)"/>

  <text x="120" y="150" fill="#e4e4e7" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="1">DIGITAL GARDEN</text>
  <text x="120" y="230" fill="#ff8569" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600">linked notes graph</text>

  <!-- graph edges -->
  <g stroke="#ff8569" stroke-width="6" stroke-linecap="round">
    <line x1="820" y1="360" x2="620" y2="220"/>
    <line x1="820" y1="360" x2="1020" y2="220"/>
    <line x1="820" y1="360" x2="620" y2="500"/>
    <line x1="820" y1="360" x2="1020" y2="500"/>
  </g>
  <g stroke="#3f3f46" stroke-width="4" stroke-linecap="round">
    <line x1="620" y1="220" x2="820" y2="120"/>
    <line x1="1020" y1="220" x2="820" y2="120"/>
    <line x1="620" y1="220" x2="460" y2="360"/>
    <line x1="620" y1="500" x2="460" y2="360"/>
    <line x1="1020" y1="220" x2="1100" y2="360"/>
    <line x1="1020" y1="500" x2="1100" y2="360"/>
    <line x1="620" y1="500" x2="820" y2="500"/>
    <line x1="1020" y1="500" x2="820" y2="500"/>
  </g>

  <!-- nodes -->
  <circle cx="820" cy="360" r="56" fill="url(#garden-accent)"/>
  <circle cx="620" cy="220" r="36" fill="#ff8569"/>
  <circle cx="1020" cy="220" r="36" fill="#ff8569"/>
  <circle cx="620" cy="500" r="36" fill="#ff8569"/>
  <circle cx="1020" cy="500" r="36" fill="#ff8569"/>
  <circle cx="820" cy="120" r="24" fill="#ffa68a"/>
  <circle cx="460" cy="360" r="24" fill="#ffa68a"/>
  <circle cx="1100" cy="360" r="24" fill="#ffa68a"/>
  <circle cx="820" cy="500" r="24" fill="#ffa68a"/>
</svg>
