<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OSS catalog: 47 repository pages generated from one machine-owned data source, with GitHub metadata mirrored into each page frontmatter">
  <rect width="1200" height="600" fill="#f8f2d8"/>

  <text x="80" y="120" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#0f2a2b">OSS CATALOG</text>
  <text x="80" y="162" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#4a6b69">one source of data, one page per repo</text>

  <!-- source block -->
  <rect x="80" y="220" width="300" height="196" rx="12" fill="#fdf8e7" stroke="#0f2a2b" stroke-width="2"/>
  <text x="106" y="264" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#0f2a2b">github-repos.toml</text>
  <text x="106" y="304" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#4a6b69">repo · stars · forks</text>
  <text x="106" y="336" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#4a6b69">licence · language</text>
  <text x="106" y="368" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#4a6b69">contributors · releases</text>
  <text x="106" y="400" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#a8331a">15 fields per repo</text>

  <!-- arrow -->
  <line x1="400" y1="318" x2="470" y2="318" stroke="#a8331a" stroke-width="4"/>
  <polygon points="470,308 492,318 470,328" fill="#a8331a"/>
  <text x="402" y="296" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#4a6b69">SYNC</text>

  <!-- page grid -->
  <g fill="#fdf8e7" stroke="#4a6b69" stroke-width="2">
    <rect x="512" y="220" width="150" height="88" rx="8"/>
    <rect x="674" y="220" width="150" height="88" rx="8"/>
    <rect x="836" y="220" width="150" height="88" rx="8"/>
    <rect x="998" y="220" width="150" height="88" rx="8"/>
    <rect x="512" y="320" width="150" height="88" rx="8"/>
    <rect x="674" y="320" width="150" height="88" rx="8"/>
    <rect x="998" y="320" width="150" height="88" rx="8"/>
  </g>
  <rect x="836" y="320" width="150" height="88" rx="8" fill="#d2573a" fill-opacity="0.18" stroke="#a8331a" stroke-width="2"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#4a6b69">
    <text x="528" y="272" fill="#4a6b69">repo</text><text x="690" y="272" fill="#4a6b69">repo</text><text x="852" y="272" fill="#4a6b69">repo</text><text x="1014" y="272" fill="#4a6b69">repo</text>
    <text x="528" y="372" fill="#4a6b69">repo</text><text x="690" y="372" fill="#4a6b69">repo</text><text x="1014" y="372" fill="#4a6b69">repo</text>
  </g>
  <text x="852" y="372" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#8c2c15">repo</text>

  <!-- counts -->
  <text x="512" y="482" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" fill="#0f2a2b">47</text>
  <text x="580" y="482" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#4a6b69">project pages</text>
  <text x="800" y="482" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" fill="#0f2a2b">26</text>
  <text x="858" y="482" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#4a6b69">tests</text>

  <text x="80" y="548" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#4a6b69">Astro 7 · content collections · idempotent frontmatter render</text>
</svg>
