<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RFM segmentation: Recency, Frequency, Monetary value bars by segment">
  <defs>
    <linearGradient id="rfm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2d8"/>
      <stop offset="1" stop-color="#f2ebc6"/>
    </linearGradient>
    <linearGradient id="rfm-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8331a"/>
      <stop offset="1" stop-color="#d2573a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#f8f2d8"/>
  <rect width="1200" height="600" fill="url(#rfm-bg)" opacity="0.55"/>

  <text x="600" y="140" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#0f2a2b" text-anchor="middle">RFM SEGMENTS</text>

  <!-- axis -->
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#0f2a2b" stroke-opacity="0.20" stroke-width="4"/>

  <!-- RFM score by segment, descending -->
  <rect x="130" y="180" width="140" height="300" rx="6" fill="url(#rfm-accent)"/>
  <rect x="380" y="240" width="140" height="240" rx="6" fill="#d2573a"/>
  <rect x="630" y="300" width="140" height="180" rx="6" fill="#d2573a"/>
  <rect x="880" y="360" width="140" height="120" rx="6" fill="#0f2a2b" fill-opacity="0.16"/>

  <text x="200" y="540" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#0f2a2b" text-anchor="middle">CHAMPIONS</text>
  <text x="450" y="540" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#0f2a2b" text-anchor="middle">LOYAL</text>
  <text x="700" y="540" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#4a6b69" text-anchor="middle">AT-RISK</text>
  <text x="950" y="540" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#4a6b69" text-anchor="middle">HIBERNATING</text>
</svg>
