<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RFM segmentation: Recency, Frequency, Monetary value bars by segment">
  <defs>
    <linearGradient id="rfm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="rfm-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#rfm-bg)"/>

  <text x="600" y="140" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#e4e4e7" text-anchor="middle">RFM SEGMENTS</text>

  <!-- axis -->
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#234044" stroke-width="4"/>

  <!-- RFM score by segment, descending -->
  <rect x="130" y="180" width="140" height="300" rx="6" fill="url(#rfm-accent)"/>
  <rect x="380" y="240" width="140" height="240" rx="6" fill="url(#rfm-accent)" opacity="0.82"/>
  <rect x="630" y="300" width="140" height="180" rx="6" fill="url(#rfm-accent)" opacity="0.62"/>
  <rect x="880" y="360" width="140" height="120" rx="6" fill="#3f3f46"/>

  <text x="200" y="540" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" fill="#e4e4e7" text-anchor="middle">CHAMPIONS</text>
  <text x="450" y="540" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" fill="#e4e4e7" text-anchor="middle">LOYAL</text>
  <text x="700" y="540" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" fill="#a1a1aa" text-anchor="middle">AT-RISK</text>
  <text x="950" y="540" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" fill="#a1a1aa" text-anchor="middle">HIBERNATING</text>
</svg>
