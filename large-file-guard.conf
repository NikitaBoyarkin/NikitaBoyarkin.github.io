# Repo-level settings for ~/.git-hooks/large-file-guard.py (see its docstring).

# Recorded characterisation suites are generated fixtures, not hand-written prose: each line is
# one call the original answered, and `rust-anything diff` / `app replay` replay the file as a
# whole. Splitting one would break the proof it carries, exactly like splitting a lockfile.
# Context: monitoring/exporter/rust/MAP.md and DECISIONS.md (ADR-006, ADR-012).
exclude = */cases.jsonl
